[package]
name = "saver-link"
description = "The Idle FighterZ screensaver's live view of the widget's run: the frame protocol and its local transport"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }
