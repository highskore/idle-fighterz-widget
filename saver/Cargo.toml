[package]
name = "idle-fighterz-saver"
description = "The Idle FighterZ screensaver: the widget's live run, or a demo run of its own"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]
members = [".", "link"]

[lib]
name = "ifz_saver"
# staticlib: linked into the macOS .saver bundle (saver/macos); rlib: the Windows .scr below
crate-type = ["staticlib", "rlib"]

# the Windows screensaver: renamed to IdleFighterZ.scr
[[bin]]
name = "idle-fighterz-saver"
path = "src/scr.rs"

[dependencies]
saver-link = { path = "link" }
planet-core = { path = "../game/rust/planet-core" }
planet-render = { path = "../game/rust/planet-render" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# the game's per-pixel loops run every frame: built for speed, as in the widget
[profile.release.package.planet-render]
opt-level = 3
[profile.release.package.planet-core]
opt-level = 3
