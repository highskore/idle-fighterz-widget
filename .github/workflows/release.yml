# desktop widget builds for macOS, Windows and Linux. On every PR (and by hand) it builds all three unsigned and
# smoke-tests the Windows and Linux ones. On a desktop-v* tag it signs what it has secrets for (macOS: sign and
# notarize, ad-hoc otherwise; Windows: Authenticode, unsigned otherwise) and attaches every package plus one
# SHA256SUMS to a GitHub Release. The secrets are listed in README.md ("Releasing"). The game comes in as a public
# submodule (game/ → highskore/planet).
name: release

on:
  push:
    tags: ['desktop-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: macos }        # universal .dmg and .zip
          - { os: windows-latest, platform: windows } # NSIS -setup.exe and .msi
          - { os: ubuntu-22.04, platform: linux }    # .AppImage and .deb (22.04's glibc, so they run on older distros too)
    runs-on: ${{ matrix.os }}
    env:
      # signing only for a release tag: PR and manual builds never see the certificates. an unset secret is '', and
      # every step that uses one checks for that first (an empty variable still counts as set to tauri)
      APPLE_CERTIFICATE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
      KEYCHAIN_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.KEYCHAIN_PASSWORD || '' }}
      WINDOWS_CERTIFICATE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.WINDOWS_CERTIFICATE || '' }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
    steps:
      # git for Windows checks text out with CRLF, and the game's page build matches its sources on \n
      - name: LF line endings
        if: matrix.platform == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb dbus-x11

      # ---- macOS ----

      # the Developer ID certificate goes into a throwaway keychain that only this run unlocks
      - name: import signing certificate
        if: matrix.platform == 'macos' && env.APPLE_CERTIFICATE != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"

      # notarizing: an App Store Connect API key if it's there, else an Apple ID with an app-specific password
      - name: notary credentials
        if: matrix.platform == 'macos' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            { echo "APPLE_API_KEY=$API_KEY_ID"; echo "APPLE_API_ISSUER=$API_ISSUER"; echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"; } >> "$GITHUB_ENV"
          elif [ -n "$APPLE_ID" ]; then
            { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_PASSWORD=$APPLE_PASSWORD"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
          else
            echo "::warning::no notary credentials: the app is signed but not notarized"
          fi

      - name: build, sign, notarize (macOS)
        if: matrix.platform == 'macos'
        run: scripts/release.sh
        env:
          TARGET: universal-apple-darwin

      - name: clean up the keychain
        if: always() && matrix.platform == 'macos' && env.APPLE_CERTIFICATE != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # ---- Windows ----

      # the code-signing certificate goes into the runner user's store; tauri signs the exe, the installer and the msi
      # with it by thumbprint (signtool, timestamped)
      - name: import code-signing certificate (Windows)
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE != ''
        shell: powershell
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $imp = @{ FilePath = $pfx; CertStoreLocation = 'Cert:\CurrentUser\My' }
          if ($env:WINDOWS_CERTIFICATE_PASSWORD) { $imp.Password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force }
          $cert = Import-PfxCertificate @imp
          Remove-Item $pfx
          $conf = Join-Path $env:RUNNER_TEMP 'signing.json'
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 4 | Set-Content -Encoding ascii $conf
          "SIGN_CONFIG=$conf" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # ---- Windows and Linux ----

      - name: build (Windows, Linux)
        if: matrix.platform != 'macos'
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run -s page
          npx tauri build ${SIGN_CONFIG:+--config "$SIGN_CONFIG"}
          B=src-tauri/target/release/bundle
          mkdir -p release
          if [ "${{ matrix.platform }}" = windows ]; then cp "$B"/nsis/*-setup.exe "$B"/msi/*.msi release/
          else cp "$B"/appimage/*.AppImage "$B"/deb/*.deb release/
          fi
          ls -l release

      # install it the way install.ps1 does, start it, and check it's still up after a while; a second launch must hand
      # over to the first and exit
      - name: smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $setup = Get-ChildItem release\*-setup.exe | Select-Object -First 1
          # Scoop unpacks this same installer with 7-Zip (packaging/scoop/powerrr.json): the app must sit at its root
          7z x $setup.FullName -o"$env:RUNNER_TEMP\unpacked" -y | Out-Null
          if (-not (Test-Path "$env:RUNNER_TEMP\unpacked\powerrr.exe")) { Get-ChildItem -Recurse "$env:RUNNER_TEMP\unpacked"; throw 'no powerrr.exe at the root of the installer' }
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Powerrr\*.exe" | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw 'nothing installed in %LOCALAPPDATA%\Powerrr' }
          "installed $($exe.FullName)"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "exited with $($p.ExitCode)" }
          $second = Start-Process $exe.FullName -PassThru
          if (-not $second.WaitForExit(15000)) { throw 'a second launch kept running' }
          if ($p.HasExited) { throw 'the first instance died' }
          Stop-Process $p.Id
          'ok'

      # the AppImage under Xvfb, which has no compositor: it must fall back to window mode rather than fail
      - name: smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ./release/*.deb
          dpkg -s powerrr | grep -E '^(Version|Depends)'
          APP=$(ls release/*.AppImage)
          chmod +x "$APP"
          dbus-run-session -- xvfb-run -a sh -c "\"$APP\" --appimage-extract-and-run > run.log 2>&1 & sleep 20; kill -0 \$! && kill \$!" || { cat run.log; exit 1; }
          cat run.log
          grep -q 'no compositor' run.log

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: powerrr-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.msi
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # install.ps1 is served as https://highskore.com/install.ps1 from the highskore.com repo; packaging/install.ps1 is a
  # copy. Here it runs as users run it (`irm … | iex` in Windows PowerShell 5.1): it must refuse a bad checksum,
  # install this build from a stand-in for its GitHub release, reinstall over the running app, and uninstall cleanly.
  # Then it runs against the real latest release
  install-ps1:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4.3.0
        with:
          name: powerrr-windows
          path: release

      - name: the copy matches highskore.com
        shell: bash
        run: curl -fsSL https://highskore.com/install.ps1 | cmp - packaging/install.ps1 || echo "::warning::packaging/install.ps1 differs from https://highskore.com/install.ps1"

      - name: install.ps1
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:LOCALAPPDATA\Powerrr"
          $url = 'http://127.0.0.1:8765'
          $srv = Join-Path $env:RUNNER_TEMP 'srv'
          $null = New-Item -ItemType Directory $srv
          $setup = Get-ChildItem release\*_x64-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName, packaging\install.ps1 $srv
          # the release as GitHub's API describes it, with a SHA256SUMS in sha256sum's format, and one with a wrong hash
          "$((Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower())  $($setup.Name)" | Set-Content -Encoding ascii "$srv\SHA256SUMS"
          "$('0' * 64)  $($setup.Name)" | Set-Content -Encoding ascii "$srv\BADSUMS"
          foreach ($r in @(('good', 'SHA256SUMS'), ('bad', 'BADSUMS'))) {
            @{ tag_name = "ci-$($r[0])"; assets = @(@{ name = $setup.Name; browser_download_url = "$url/$($setup.Name)" }, @{ name = 'SHA256SUMS'; browser_download_url = "$url/$($r[1])" }) } |
              ConvertTo-Json -Depth 4 | Set-Content -Encoding ascii "$srv\$($r[0]).json"
          }
          # Vercel serves install.ps1 as application/octet-stream; so does this
          @'
          import functools, http.server, sys
          H = http.server.SimpleHTTPRequestHandler
          H.extensions_map = {'.ps1': 'application/octet-stream', '.json': 'application/json'}
          http.server.ThreadingHTTPServer(('127.0.0.1', 8765), functools.partial(H, directory=sys.argv[1])).serve_forever()
          '@ | Set-Content -Encoding ascii "$env:RUNNER_TEMP\serve.py"
          $server = Start-Process python -ArgumentList "`"$env:RUNNER_TEMP\serve.py`"", "`"$srv`"" -PassThru -WindowStyle Hidden
          for ($i = 0; ; $i++) { try { $null = Invoke-WebRequest "$url/good.json" -UseBasicParsing; break } catch { if ($i -gt 30) { throw } Start-Sleep 1 } }

          # a fresh Windows PowerShell, as from the README; its exit code and everything it printed
          function Run-Install($cmd) {
            $ErrorActionPreference = 'Continue'
            $out = powershell -NoProfile -Command $cmd 2>&1 | Out-String
            Write-Host $out
            @{ code = $LASTEXITCODE; out = $out }
          }
          function Registered { [bool](Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -eq 'Powerrr') }
          function Uninstall {
            Get-Process powerrr -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            $un = Get-ChildItem "$dir\uninstall*.exe" | Select-Object -First 1
            if (-not $un) { throw "no uninstaller in $dir" }
            Start-Process $un.FullName -ArgumentList '/S' -Wait
            # NSIS's uninstaller copies itself to %TEMP% and returns at once: wait for the files to go
            for ($i = 0; $i -lt 60 -and (Test-Path "$dir\powerrr.exe"); $i++) { Start-Sleep 1 }
            if (Test-Path "$dir\powerrr.exe") { throw 'the uninstaller left powerrr.exe' }
            if (Registered) { throw 'the uninstaller left its entry in Apps' }
            'uninstalled'
          }

          '--- a wrong sha256 is refused, and nothing is installed'
          $env:POWERRR_RELEASE = "$url/bad.json"
          $r = Run-Install "irm $url/install.ps1 | iex"
          if ($r.code -eq 0 -or $r.out -notmatch 'sha256 mismatch') { throw "a wrong sha256 wasn't refused (exit $($r.code))" }
          if (Test-Path "$dir\powerrr.exe") { throw 'installed despite the wrong sha256' }

          '--- this build installs and starts'
          $env:POWERRR_RELEASE = "$url/good.json"
          $r = Run-Install "irm $url/install.ps1 | iex"
          if ($r.code -ne 0) { throw "install.ps1 failed (exit $($r.code))" }
          if (-not (Test-Path "$dir\powerrr.exe")) { throw "no powerrr.exe in $dir" }
          if (-not (Registered)) { throw 'not in Apps' }
          Start-Sleep 15
          $first = @(Get-Process powerrr -ErrorAction SilentlyContinue)
          if ($first.Count -ne 1) { throw "expected one powerrr running, found $($first.Count)" }

          '--- installing again replaces the running app'
          $r = Run-Install "irm $url/install.ps1 | iex"
          if ($r.code -ne 0) { throw "reinstalling failed (exit $($r.code))" }
          Start-Sleep 15
          $now = @(Get-Process powerrr -ErrorAction SilentlyContinue)
          if ($now.Count -ne 1 -or $now[0].Id -eq $first[0].Id) { throw "expected a new powerrr running, found $($now.Id -join ', ') (was $($first[0].Id))" }

          '--- uninstall'
          Uninstall
          Stop-Process $server.Id

          '--- the latest release'
          Remove-Item Env:POWERRR_RELEASE
          $env:POWERRR_REPO = $env:GITHUB_REPOSITORY
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          $r = Run-Install 'Get-Content -Raw packaging\install.ps1 | iex'
          if ($latest.assets.name -like '*_x64-setup.exe') {
            if ($r.code -ne 0) { throw "install.ps1 failed on $($latest.tag_name) (exit $($r.code))" }
            if (-not (Test-Path "$dir\powerrr.exe")) { throw "no powerrr.exe in $dir" }
            Uninstall
          } else {
            if ($r.code -eq 0 -or $r.out -notmatch 'has no Windows installer') { throw "expected install.ps1 to say $($latest.tag_name) has no Windows installer" }
            "::notice::the latest release ($($latest.tag_name)) has no Windows installer: install.ps1 says so and stops"
          }
          exit 0 # the step would otherwise end with the last install.ps1 run's exit code

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4.3.0
        with:
          path: release
          merge-multiple: true

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          WIN_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          NAME=$(node -p "require('../src-tauri/tauri.conf.json').productName")
          NOTE="$NAME $VERSION for macOS 11+ (Apple silicon and Intel), Windows 10+ (x64) and Linux (x86_64 AppImage and .deb)."
          [ "$MAC_SIGNED" = true ] || NOTE="$NOTE The macOS build is not notarized: right-click the app → Open the first time."
          [ "$WIN_SIGNED" = true ] || NOTE="$NOTE The Windows build is not signed: SmartScreen may say \"Windows protected your PC\"; click More info → Run anyway."
          gh release create "$GITHUB_REF_NAME" -- * --title "$NAME $VERSION" --notes "$NOTE"
