# desktop widget builds for macOS, Windows and Linux. On every PR (and by hand) it builds all three unsigned and
# smoke-tests the Windows and Linux ones. On a desktop-v* tag it signs what it has secrets for (macOS: sign and
# notarize, ad-hoc otherwise; Windows: Authenticode, unsigned otherwise) and attaches every package plus one
# SHA256SUMS to a GitHub Release. The secrets are listed in README.md ("Releasing"). The game comes in as a public
# submodule (game/ → highskore/planet).
name: release

on:
  push:
    tags: ['desktop-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: macos }        # universal .dmg and .zip
          - { os: windows-latest, platform: windows } # NSIS -setup.exe and .msi
          - { os: ubuntu-22.04, platform: linux }    # .AppImage and .deb (22.04's glibc, so they run on older distros too)
    runs-on: ${{ matrix.os }}
    env:
      # signing only for a release tag: PR and manual builds never see the certificates. an unset secret is '', and
      # every step that uses one checks for that first (an empty variable still counts as set to tauri)
      APPLE_CERTIFICATE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
      KEYCHAIN_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.KEYCHAIN_PASSWORD || '' }}
      WINDOWS_CERTIFICATE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.WINDOWS_CERTIFICATE || '' }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb dbus-x11

      # ---- macOS ----

      # the Developer ID certificate goes into a throwaway keychain that only this run unlocks
      - name: import signing certificate
        if: matrix.platform == 'macos' && env.APPLE_CERTIFICATE != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"

      # notarizing: an App Store Connect API key if it's there, else an Apple ID with an app-specific password
      - name: notary credentials
        if: matrix.platform == 'macos' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            { echo "APPLE_API_KEY=$API_KEY_ID"; echo "APPLE_API_ISSUER=$API_ISSUER"; echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"; } >> "$GITHUB_ENV"
          elif [ -n "$APPLE_ID" ]; then
            { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_PASSWORD=$APPLE_PASSWORD"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
          else
            echo "::warning::no notary credentials: the app is signed but not notarized"
          fi

      - name: build, sign, notarize (macOS)
        if: matrix.platform == 'macos'
        run: scripts/release.sh
        env:
          TARGET: universal-apple-darwin

      - name: clean up the keychain
        if: always() && matrix.platform == 'macos' && env.APPLE_CERTIFICATE != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # ---- Windows ----

      # the code-signing certificate goes into the runner user's store; tauri signs the exe, the installer and the msi
      # with it by thumbprint (signtool, timestamped)
      - name: import code-signing certificate (Windows)
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE != ''
        shell: powershell
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $imp = @{ FilePath = $pfx; CertStoreLocation = 'Cert:\CurrentUser\My' }
          if ($env:WINDOWS_CERTIFICATE_PASSWORD) { $imp.Password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force }
          $cert = Import-PfxCertificate @imp
          Remove-Item $pfx
          $conf = Join-Path $env:RUNNER_TEMP 'signing.json'
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 4 | Set-Content -Encoding ascii $conf
          "SIGN_CONFIG=$conf" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # ---- Windows and Linux ----

      - name: build (Windows, Linux)
        if: matrix.platform != 'macos'
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run -s page
          npx tauri build ${SIGN_CONFIG:+--config "$SIGN_CONFIG"}
          B=src-tauri/target/release/bundle
          mkdir -p release
          if [ "${{ matrix.platform }}" = windows ]; then cp "$B"/nsis/*-setup.exe "$B"/msi/*.msi release/
          else cp "$B"/appimage/*.AppImage "$B"/deb/*.deb release/
          fi
          ls -l release

      # install it the way install.ps1 does, start it, and check it's still up after a while; a second launch must hand
      # over to the first and exit
      - name: smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $setup = Get-ChildItem release\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Powerrr\*.exe" | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw 'nothing installed in %LOCALAPPDATA%\Powerrr' }
          "installed $($exe.FullName)"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "exited with $($p.ExitCode)" }
          $second = Start-Process $exe.FullName -PassThru
          if (-not $second.WaitForExit(15000)) { throw 'a second launch kept running' }
          if ($p.HasExited) { throw 'the first instance died' }
          Stop-Process $p.Id
          'ok'

      # the AppImage under Xvfb, which has no compositor: it must fall back to window mode rather than fail
      - name: smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ./release/*.deb
          dpkg -s powerrr | grep -E '^(Version|Depends)'
          APP=$(ls release/*.AppImage)
          chmod +x "$APP"
          dbus-run-session -- xvfb-run -a sh -c "\"$APP\" --appimage-extract-and-run > run.log 2>&1 & sleep 20; kill -0 \$! && kill \$!" || { cat run.log; exit 1; }
          cat run.log
          grep -q 'no compositor' run.log

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: powerrr-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.msi
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4.3.0
        with:
          path: release
          merge-multiple: true

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          WIN_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          NAME=$(node -p "require('../src-tauri/tauri.conf.json').productName")
          NOTE="$NAME $VERSION for macOS 11+ (Apple silicon and Intel), Windows 10+ (x64) and Linux (x86_64 AppImage and .deb)."
          [ "$MAC_SIGNED" = true ] || NOTE="$NOTE The macOS build is not notarized: right-click the app → Open the first time."
          [ "$WIN_SIGNED" = true ] || NOTE="$NOTE The Windows build is not signed: SmartScreen may say \"Windows protected your PC\"; click More info → Run anyway."
          gh release create "$GITHUB_REF_NAME" -- * --title "$NAME $VERSION" --notes "$NOTE"
