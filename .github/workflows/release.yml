# desktop widget builds for macOS, Windows and Linux. On every PR (and by hand) it builds all three unsigned and
# smoke-tests the Windows and Linux ones. On a desktop-v* tag it signs what it has secrets for (macOS: sign and
# notarize, ad-hoc otherwise; Windows: Authenticode, unsigned otherwise) and attaches every package plus one
# SHA256SUMS to a GitHub Release. The secrets live in the `release` environment, which only desktop-v* tags may use,
# and each goes only to the step that needs it, never to the job that compiles (docs/RELEASING.md). Third-party actions are pinned to commits. The
# game comes in as a public submodule (game/ → highskore/idle-fighterz).
name: release

on:
  push:
    tags: ['desktop-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # minisign, to sign SHA256SUMS (release) and to test the installers' checks of it: pinned, and checked against
  # these sha256s (the files' own minisign signatures, by jedisct1's key, verify too)
  MINISIGN_VERSION: '0.12'
  MINISIGN_LINUX_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
  MINISIGN_MACOS_SHA256: 89000b19535765f9cffc65a65d64a820f433ef6db8020667f7570e06bf6aac63
  MINISIGN_WIN64_SHA256: 37B600344E20C19314B2E82813DB2BFDCC408B77B876F7727889DBD46D539479

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: macos }        # universal .dmg and .zip
          - { os: windows-latest, platform: windows } # NSIS -setup.exe and .msi
          - { os: ubuntu-22.04, platform: linux }    # .AppImage and .deb (22.04's glibc, so they run on older distros too)
    runs-on: ${{ matrix.os }}
    # no environment, so no secrets, ever: this job runs npm's install scripts and every crate's build script and proc
    # macro. The macOS app and the Windows exe leave it unsigned, for package-macos and package-windows to sign
    steps:
      # git for Windows checks text out with CRLF, and the game's page build matches its sources on \n
      - name: LF line endings
        if: matrix.platform == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: |
            src-tauri
            saver
          key: ${{ matrix.platform }}

      - name: linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb dbus-x11

      # before any secret is in the job: npm's install scripts never run next to one
      - name: node packages and the page
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run -s page
          npm test

      # what ships (the default features), and the other builds still in the code: 0.1's web-view game (none) and the
      # canvas path alone (rust-core). A tag's commit has been through this
      - name: cargo test and clippy, every feature (macOS)
        if: matrix.platform == 'macos' && !startsWith(github.ref, 'refs/tags/')
        working-directory: src-tauri
        run: |
          cargo test
          for f in rust-core,native-renderer '' rust-core; do
            echo "--- clippy ${f:-no features}"
            cargo clippy --all-targets --no-default-features ${f:+--features $f} -- -D warnings
          done

      - name: cargo test (Windows, Linux)
        if: matrix.platform != 'macos' && !startsWith(github.ref, 'refs/tags/')
        working-directory: src-tauri
        shell: bash
        run: |
          cargo check
          cargo test

      # ---- macOS and Windows: compiled here, signed and packaged by package-macos and package-windows ----

      # the app with the screensaver in its Resources (scripts/release.sh builds both), ad-hoc signed (tauri.conf.json's
      # signingIdentity "-"), as a zip that keeps its symlinks and modes
      - name: build (macOS)
        if: matrix.platform == 'macos'
        env:
          TARGET: universal-apple-darwin
        run: |
          scripts/release.sh build
          ditto -c -k --keepParent "src-tauri/target/$TARGET/release/bundle/macos/Idle FighterZ.app" "$RUNNER_TEMP/app.zip"

      # the exe and the screensaver (the saver's exe, as IdleFighterZ.scr), both unsigned, side by side
      - name: build (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          npx tauri build --no-bundle
          cargo build --release --manifest-path saver/Cargo.toml --bin idle-fighterz-saver
          mkdir "$RUNNER_TEMP/windows"
          cp src-tauri/target/release/idle-fighterz.exe "$RUNNER_TEMP/windows/"
          cp saver/target/release/idle-fighterz-saver.exe "$RUNNER_TEMP/windows/IdleFighterZ.scr"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.platform != 'linux'
        with:
          name: unsigned-${{ matrix.platform }}
          path: ${{ matrix.platform == 'macos' && format('{0}/app.zip', runner.temp) || format('{0}/windows', runner.temp) }}
          if-no-files-found: error

      # ---- Linux ----

      - name: build (Linux)
        if: matrix.platform == 'linux'
        run: |
          npx tauri build
          B=src-tauri/target/release/bundle
          mkdir -p release
          cp "$B"/appimage/*.AppImage "$B"/deb/*.deb release/
          # tauri names them after productName, space and all; GitHub would turn the space into a dot, and SHA256SUMS
          # would no longer name them: IdleFighterZ_<version>_…, as scripts/release.sh names the macOS ones
          for f in release/*; do [ "$f" = "${f// /}" ] || mv "$f" "${f// /}"; done
          ls -l release

      # the AppImage under Xvfb, which has no compositor: it must fall back to window mode rather than fail. Hidden (by
      # IDLE_FIGHTERZ_SMOKE, after 8 s), the page must hear it and the Rust core keep the game going
      - name: smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ./release/*.deb
          dpkg -s "$(dpkg-deb -f release/*.deb Package)" | grep -E '^(Package|Version|Depends)'
          APP=$(ls release/*.AppImage)
          chmod +x "$APP"
          export IDLE_FIGHTERZ_SMOKE=$PWD/smoke.log
          dbus-run-session -- xvfb-run -a sh -c "\"$APP\" --appimage-extract-and-run > run.log 2>&1 & sleep 20; kill -0 \$! && kill \$!" || { cat run.log; exit 1; }
          cat run.log smoke.log
          grep -q 'no compositor' run.log
          grep -q 'engine: the Rust core' smoke.log
          grep -q 'hidden=true away=true' smoke.log
          grep -q 'hidden: the core plays on' smoke.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.platform == 'linux'
        with:
          name: idle-fighterz-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # signs the app build made, on a fresh runner that has run none of the build's code: the Developer ID goes into a
  # throwaway keychain only codesign may use, and only after the app is built; then notarizes, staples and packs the
  # .dmg and .zip from the signed app. On a PR, or with no certificate, it packs the ad-hoc signed app as it is.
  # The app comes from the build job, so it's untrusted input: it's checked before it's unpacked, unpacked outside the
  # checkout (which is read-only by then), and signed and packed where it lies
  package-macos:
    needs: build
    runs-on: macos-15
    environment: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'release' || '' }}
    env:
      TARGET: universal-apple-darwin
    steps:
      # scripts/release.sh and tauri.conf.json; nothing here is built or run
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: make the checkout read-only
        run: chmod -R a-w "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-macos
          path: ${{ runner.temp }}/unsigned

      # every entry must lie inside "Idle FighterZ.app/" with no .. in its path, and none may be a symlink (the app has
      # none): so unpacking can't write, or later steps follow a link, outside the fresh directory it goes into
      - name: check and unpack the app
        run: |
          Z="$RUNNER_TEMP/unsigned/app.zip"
          [ "$(ls -A "$RUNNER_TEMP/unsigned")" = app.zip ] || { echo "::error::unsigned-macos must hold app.zip alone"; exit 1; }
          zipinfo -1 "$Z" > "$RUNNER_TEMP/entries"
          if grep -vE '^Idle FighterZ\.app/' "$RUNNER_TEMP/entries" || grep -E '(^|/)\.\.(/|$)' "$RUNNER_TEMP/entries"; then
            echo "::error::app.zip has an entry outside Idle FighterZ.app/ (above)"; exit 1
          fi
          if zipinfo "$Z" | grep '^l'; then echo "::error::app.zip has a symlink (above)"; exit 1; fi
          D=$(mktemp -d "$RUNNER_TEMP/app.XXXXXX")
          ditto -x -k "$Z" "$D"
          [ "$(ls -A "$D")" = 'Idle FighterZ.app' ] || { echo "::error::app.zip unpacked to more than the app"; exit 1; }
          if find "$D" -type l | grep .; then echo "::error::a symlink after unpacking (above)"; exit 1; fi
          [ -d "$D/Idle FighterZ.app/Contents/Resources/Idle FighterZ.saver" ] || { echo "::error::the app has no screensaver"; exit 1; }
          codesign --verify --strict --deep "$D/Idle FighterZ.app"
          echo "APP=$D/Idle FighterZ.app" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      - name: import signing certificate
        id: cert
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "no APPLE_CERTIFICATE: the app is ad-hoc signed"; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          echo "imported=true" >> "$GITHUB_OUTPUT"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          # the key's access list names codesign alone, not every app (-A)
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"

      - name: sign (macOS)
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.cert.outputs.imported == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: scripts/release.sh sign

      # notarizing, after signing: an App Store Connect API key if it's there, else an Apple ID with an
      # app-specific password. They're only in this step, and the key file only while it runs
      - name: notarize and package (macOS)
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.cert.outputs.imported == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          API_KEY: ${{ steps.cert.outputs.imported == 'true' && secrets.APPLE_API_KEY || '' }}
          API_KEY_ID: ${{ steps.cert.outputs.imported == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          API_ISSUER: ${{ steps.cert.outputs.imported == 'true' && secrets.APPLE_API_ISSUER || '' }}
          NOTARY_APPLE_ID: ${{ steps.cert.outputs.imported == 'true' && secrets.APPLE_ID || '' }}
          NOTARY_PASSWORD: ${{ steps.cert.outputs.imported == 'true' && secrets.APPLE_PASSWORD || '' }}
          NOTARY_TEAM_ID: ${{ steps.cert.outputs.imported == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
          if [ -n "$API_KEY" ]; then
            (umask 077; printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8")
            export APPLE_API_KEY="$API_KEY_ID" APPLE_API_ISSUER="$API_ISSUER" APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          elif [ -n "$NOTARY_APPLE_ID" ]; then
            export APPLE_ID="$NOTARY_APPLE_ID" APPLE_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM_ID"
          elif [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::no notary credentials: the app is signed but not notarized"
          fi
          unset API_KEY NOTARY_PASSWORD
          scripts/release.sh package

      - name: clean up the keychain
        if: always() && steps.cert.outputs.imported == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idle-fighterz-macos
          path: |
            ${{ runner.temp }}/release/*.dmg
            ${{ runner.temp }}/release/*.zip
          if-no-files-found: error

  # bundles the exe and the screensaver build compiled, on a fresh runner that has run none of the build's code. The
  # installers embed the exe, and tauri patches it per installer (the bundle type, for its updater) before packing it,
  # so it must sign the exe after that patch: `tauri bundle` signs the exe, the -setup.exe and the .msi by thumbprint
  # (signtool, timestamped). The .scr is a resource, which tauri doesn't sign, so signtool signs it first, the same
  # way. The certificate is in the store only for those steps; no cargo build, build script or npm install script
  # runs in this job, and the app itself runs only after the certificate is gone
  package-windows:
    needs: build
    runs-on: windows-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'release' || '' }}
    steps:
      # the exe and the .scr come from the build job, so they're untrusted input: downloaded outside the checkout before
      # there is one, and only two plain files of the expected names are copied in, by the step after the checkout
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-windows
          path: ${{ runner.temp }}/unsigned

      - name: check the exe and the .scr
        shell: powershell
        run: |
          $files = @(Get-ChildItem -Recurse -Force "$env:RUNNER_TEMP\unsigned")
          $plain = @($files | Where-Object { -not $_.PSIsContainer -and -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) })
          $missing = @('idle-fighterz.exe', 'IdleFighterZ.scr' | Where-Object { $_ -cnotin $plain.Name })
          if ($files.Count -ne 2 -or $plain.Count -ne 2 -or $missing.Count) {
            $files | Format-List FullName, Attributes; throw 'unsigned-windows must hold idle-fighterz.exe and IdleFighterZ.scr alone, as plain files'
          }

      # tauri.conf.json, the icons, and the game's path crates that cargo metadata wants; nothing here is compiled
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # only the tauri CLI is needed; no package's install scripts run
      - name: tauri CLI
        run: npm ci --no-audit --no-fund --ignore-scripts

      # the .scr where saver/tauri.windows.json takes it from
      - name: put the exe and the .scr where tauri bundles them from
        shell: powershell
        run: |
          $null = New-Item -ItemType Directory -Force src-tauri\target\release, saver\build
          Copy-Item "$env:RUNNER_TEMP\unsigned\idle-fighterz.exe" src-tauri\target\release\idle-fighterz.exe
          Copy-Item "$env:RUNNER_TEMP\unsigned\IdleFighterZ.scr" saver\build\IdleFighterZ.scr

      # the code-signing certificate goes into the runner user's store, its private key not exportable
      - name: import code-signing certificate (Windows)
        id: cert
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: powershell
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { 'no WINDOWS_CERTIFICATE: the Windows packages are unsigned'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $imp = @{ FilePath = $pfx; CertStoreLocation = 'Cert:\CurrentUser\My' }
          if ($env:WINDOWS_CERTIFICATE_PASSWORD) { $imp.Password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force }
          $cert = Import-PfxCertificate @imp
          Remove-Item $pfx
          "thumbprint=$($cert.Thumbprint)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $conf = Join-Path $env:RUNNER_TEMP 'signing.json'
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 4 | Set-Content -Encoding ascii $conf
          "SIGN_CONFIG=$conf" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # as tauri signs the exe: the imported certificate by thumbprint, sha256, an RFC 3161 timestamp
      - name: sign the screensaver (Windows)
        if: steps.cert.outputs.thumbprint != ''
        shell: powershell
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw 'no signtool.exe in the Windows SDK' }
          & $signtool.FullName sign /sha1 $env:THUMBPRINT /s My /fd sha256 /tr http://timestamp.digicert.com /td sha256 saver\build\IdleFighterZ.scr
          if ($LASTEXITCODE) { throw 'signing IdleFighterZ.scr failed' }
          & $signtool.FullName verify /pa saver\build\IdleFighterZ.scr
          if ($LASTEXITCODE) { throw "IdleFighterZ.scr's signature doesn't verify" }

      - name: bundle and sign (Windows)
        shell: bash
        run: |
          npx tauri bundle --config saver/tauri.windows.json ${SIGN_CONFIG:+--config "$SIGN_CONFIG"}
          B=src-tauri/target/release/bundle
          mkdir -p release
          cp "$B"/nsis/*-setup.exe "$B"/msi/*.msi release/
          # tauri names them after productName, space and all; GitHub would turn the space into a dot, and SHA256SUMS
          # would no longer name them: IdleFighterZ_<version>_…, as scripts/release.sh names the macOS ones
          for f in release/*; do [ "$f" = "${f// /}" ] || mv "$f" "${f// /}"; done
          ls -l release

      - name: remove the certificate
        if: always() && steps.cert.outputs.thumbprint != ''
        shell: powershell
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: Remove-Item "Cert:\CurrentUser\My\$env:THUMBPRINT" -DeleteKey

      # install it the way install.ps1 does, start it, and check it's still up after a while; a second launch must hand
      # over to the first and exit. IDLE_FIGHTERZ_SMOKE hides the widget after 8 s: WebView2 must then tell the page it's
      # hidden, and the Rust core must keep the game going (the tray number is on by default)
      - name: smoke test (Windows)
        shell: powershell
        env:
          SIGNED: ${{ steps.cert.outputs.thumbprint != '' && 'true' || '' }}
        run: |
          $setup = Get-ChildItem release\*-setup.exe | Select-Object -First 1
          # Scoop unpacks this same installer with 7-Zip (packaging/scoop/idle-fighterz.json): the app must sit at its root
          7z x $setup.FullName -o"$env:RUNNER_TEMP\unpacked" -y | Out-Null
          if (-not (Test-Path "$env:RUNNER_TEMP\unpacked\idle-fighterz.exe")) { Get-ChildItem -Recurse "$env:RUNNER_TEMP\unpacked"; throw 'no idle-fighterz.exe at the root of the installer' }
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Idle FighterZ\*.exe" | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw 'nothing installed in %LOCALAPPDATA%\Idle FighterZ' }
          "installed $($exe.FullName)"
          # beside the exe is the app's resource dir, where the tray's Install Screensaver… looks for it
          $scr = Join-Path $exe.DirectoryName 'IdleFighterZ.scr'
          if (-not (Test-Path $scr -PathType Leaf)) { Get-ChildItem $exe.DirectoryName; throw 'no IdleFighterZ.scr installed beside the exe' }
          if ($env:SIGNED -and (Get-AuthenticodeSignature $scr).Status -ne 'Valid') { throw 'the installed IdleFighterZ.scr is not validly signed' }
          $env:IDLE_FIGHTERZ_SMOKE = "$env:RUNNER_TEMP\smoke.log"
          $p = Start-Process $exe.FullName -PassThru
          Remove-Item Env:IDLE_FIGHTERZ_SMOKE
          Start-Sleep 20
          Get-Content "$env:RUNNER_TEMP\smoke.log" -ErrorAction SilentlyContinue
          if ($p.HasExited) { throw "exited with $($p.ExitCode)" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\smoke.log" -SimpleMatch 'engine: the Rust core' -Quiet)) { throw 'the game is not on the Rust core' }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\smoke.log" -SimpleMatch 'page hidden=true away=true' -Quiet)) { throw 'hidden, the page did not see document.hidden' }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\smoke.log" -SimpleMatch 'hidden: the core plays on' -Quiet)) { throw 'hidden, the core did not keep playing' }
          $second = Start-Process $exe.FullName -PassThru
          if (-not $second.WaitForExit(15000)) { throw 'a second launch kept running' }
          if ($p.HasExited) { throw 'the first instance died' }
          Stop-Process $p.Id
          'ok'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idle-fighterz-windows
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error

  # install.ps1 is served as https://highskore.com/install.ps1 from the highskore.com repo; packaging/install.ps1 is a
  # copy. Here it runs as users run it (`irm … | iex` in Windows PowerShell 5.1): it must refuse an elevated shell, a
  # bad checksum, and a SHA256SUMS that is unsigned, changed after signing, signed for another release or with another
  # key (a throwaway one made here); install this build from a stand-in for its GitHub release, reinstall over the
  # running app, and uninstall cleanly. Then it runs against the real latest release, if that has signed Windows assets
  install-ps1:
    needs: package-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: idle-fighterz-windows
          path: release

      # a release ships only what the site serves: on a tag a difference fails (and the release needs this job)
      - name: the copy matches highskore.com
        shell: bash
        run: |
          curl -fsSL https://highskore.com/install.ps1 | cmp - packaging/install.ps1 && exit 0
          case "$GITHUB_REF" in
            refs/tags/desktop-v*) echo "::error::packaging/install.ps1 differs from https://highskore.com/install.ps1"; exit 1 ;;
            *) echo "::warning::packaging/install.ps1 differs from https://highskore.com/install.ps1" ;;
          esac

      - name: install.ps1
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:LOCALAPPDATA\Idle FighterZ"
          $url = 'http://127.0.0.1:8765'
          $srv = Join-Path $env:RUNNER_TEMP 'srv'
          $null = New-Item -ItemType Directory $srv
          $setup = Get-ChildItem release\*_x64-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName $srv

          # minisign, pinned, to make a throwaway key and sign a stand-in SHA256SUMS with it (never a real key)
          $zip = Join-Path $env:RUNNER_TEMP 'minisign.zip'
          Invoke-WebRequest "https://github.com/jedisct1/minisign/releases/download/$env:MINISIGN_VERSION/minisign-$env:MINISIGN_VERSION-win64.zip" -OutFile $zip -UseBasicParsing
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:MINISIGN_WIN64_SHA256) { throw 'minisign download: sha256 mismatch' }
          Expand-Archive $zip "$env:RUNNER_TEMP\minisign"
          $ms = "$env:RUNNER_TEMP\minisign\minisign-win64\x86_64\minisign.exe"
          $k = Join-Path $env:RUNNER_TEMP 'testkey'
          $null = New-Item -ItemType Directory $k
          & $ms -G -W -p "$k\k.pub" -s "$k\k.key"
          if ($LASTEXITCODE) { throw 'minisign -G failed' }
          $testKey = (Get-Content "$k\k.pub")[1]

          # the releases as GitHub's API describes them, each with a SHA256SUMS in sha256sum's format: signed with the
          # test key, signed with a wrong hash, and signed then changed. ci-unsigned is one whose .minisig was deleted
          "$((Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower())  $($setup.Name)" | Set-Content -Encoding ascii "$srv\SHA256SUMS"
          "$('0' * 64)  $($setup.Name)" | Set-Content -Encoding ascii "$srv\BADSUMS"
          Copy-Item "$srv\SHA256SUMS" "$srv\SIGNED"
          & $ms -S -l -s "$k\k.key" -m "$srv\SIGNED" -t 'idle-fighterz ci-signed'
          if ($LASTEXITCODE) { throw 'minisign -S failed' }
          & $ms -S -l -s "$k\k.key" -m "$srv\BADSUMS" -t 'idle-fighterz ci-signedbad'
          if ($LASTEXITCODE) { throw 'minisign -S failed' }
          # ci-signed's signature with a second "trusted comment" after a bare CR, which Get-Content would split on
          $m = [IO.File]::ReadAllText("$srv\SIGNED.minisig").Replace('trusted comment: idle-fighterz ci-signed', "trusted comment: idle-fighterz ci-signed`rtrusted comment: idle-fighterz ci-crtrick")
          [IO.File]::WriteAllText("$srv\CRTRICK.minisig", $m)
          Copy-Item "$srv\SIGNED" "$srv\TAMPERED"
          Add-Content -Encoding ascii "$srv\TAMPERED" "$('0' * 64)  extra"
          # ci-replay serves ci-signed's SHA256SUMS and signature as its own
          foreach ($r in @(('unsigned', 'SHA256SUMS', ''), ('signed', 'SIGNED', 'SIGNED.minisig'), ('signedbad', 'BADSUMS', 'BADSUMS.minisig'), ('tampered', 'TAMPERED', 'SIGNED.minisig'), ('replay', 'SIGNED', 'SIGNED.minisig'), ('crtrick', 'SIGNED', 'CRTRICK.minisig'))) {
            $assets = @(@{ name = $setup.Name; browser_download_url = "$url/$($setup.Name)" }, @{ name = 'SHA256SUMS'; browser_download_url = "$url/$($r[1])" })
            if ($r[2]) { $assets += @{ name = 'SHA256SUMS.minisig'; browser_download_url = "$url/$($r[2])" } }
            @{ tag_name = "ci-$($r[0])"; assets = $assets } | ConvertTo-Json -Depth 4 | Set-Content -Encoding ascii "$srv\$($r[0]).json"
          }

          # the installer with its real key, and copies with the test key, no key, and the test key plus a required
          # Authenticode signer
          $src = Get-Content -Raw packaging\install.ps1
          $real = [regex]::Match($src, "MinisignPublicKey = '([^']*)'").Groups[1].Value
          if (-not $real) { throw "packaging/install.ps1 has no MinisignPublicKey" }
          $test = $src.Replace("MinisignPublicKey = '$real'", "MinisignPublicKey = '$testKey'")
          $src | Set-Content -Encoding ascii "$srv\install.ps1"
          $test | Set-Content -Encoding ascii "$srv\install-test.ps1"
          $src.Replace("MinisignPublicKey = '$real'", "MinisignPublicKey = ''") | Set-Content -Encoding ascii "$srv\install-nokey.ps1"
          $test.Replace("SignerSubject = ''", "SignerSubject = 'CN=Nobody'") | Set-Content -Encoding ascii "$srv\install-signer.ps1"

          # Vercel serves install.ps1 as application/octet-stream; so does this
          @'
          import functools, http.server, sys
          H = http.server.SimpleHTTPRequestHandler
          H.extensions_map = {'.ps1': 'application/octet-stream', '.json': 'application/json'}
          http.server.ThreadingHTTPServer(('127.0.0.1', 8765), functools.partial(H, directory=sys.argv[1])).serve_forever()
          '@ | Set-Content -Encoding ascii "$env:RUNNER_TEMP\serve.py"
          $server = Start-Process python -ArgumentList "`"$env:RUNNER_TEMP\serve.py`"", "`"$srv`"" -PassThru -WindowStyle Hidden
          for ($i = 0; ; $i++) { try { $null = Invoke-WebRequest "$url/signed.json" -UseBasicParsing; break } catch { if ($i -gt 30) { throw } Start-Sleep 1 } }

          # a fresh Windows PowerShell, as from the README; its exit code and everything it printed
          function Run-Install($cmd) {
            $ErrorActionPreference = 'Continue'
            $out = powershell -NoProfile -Command $cmd 2>&1 | Out-String
            Write-Host $out
            @{ code = $LASTEXITCODE; out = $out }
          }
          function Refused($script, $release, $why, $what) {
            $env:IDLE_FIGHTERZ_RELEASE = "$url/$release.json"
            $r = Run-Install "irm $url/$script | iex"
            if ($r.code -eq 0 -or $r.out -notmatch $why) { throw "$what wasn't refused (exit $($r.code))" }
            if (Test-Path "$dir\idle-fighterz.exe") { throw "installed despite: $what" }
            "ok: $what is refused"
          }
          function Registered { [bool](Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -eq 'Idle FighterZ') }
          function Uninstall {
            Get-Process idle-fighterz -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            $un = Get-ChildItem "$dir\uninstall*.exe" | Select-Object -First 1
            if (-not $un) { throw "no uninstaller in $dir" }
            Start-Process $un.FullName -ArgumentList '/S' -Wait
            # NSIS's uninstaller copies itself to %TEMP% and returns at once: wait for the files to go
            for ($i = 0; $i -lt 60 -and (Test-Path "$dir\idle-fighterz.exe"); $i++) { Start-Sleep 1 }
            if (Test-Path "$dir\idle-fighterz.exe") { throw 'the uninstaller left idle-fighterz.exe' }
            if (Registered) { throw 'the uninstaller left its entry in Apps' }
            'uninstalled'
          }

          '--- an elevated shell is refused unless IDLE_FIGHTERZ_ALLOW_ADMIN=1 (the runner is elevated)'
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if ($admin) { Refused 'install-test.ps1' 'signed' 'elevated' 'an elevated shell' } else { '::notice::the runner is not elevated: skipped the elevated-shell check' }
          $env:IDLE_FIGHTERZ_ALLOW_ADMIN = '1'

          '--- refusals: nothing is installed'
          Refused 'install-test.ps1' 'signedbad' 'sha256 mismatch' 'a wrong sha256 under a good signature'
          Refused 'install-test.ps1' 'unsigned' 'no SHA256SUMS.minisig' 'a release without a .minisig'
          Refused 'install-test.ps1' 'tampered' "doesn't verify" 'a SHA256SUMS changed after signing'
          Refused 'install-test.ps1' 'crtrick' 'malformed' 'a .minisig with a bare CR'
          Refused 'install-test.ps1' 'replay' "was signed for 'idle-fighterz ci-signed', not 'idle-fighterz ci-replay'" "another release's signed SHA256SUMS"
          Refused 'install.ps1' 'signed' 'another key' 'a SHA256SUMS signed with another key'
          Refused 'install-nokey.ps1' 'signed' 'no key to check it with' 'a signed SHA256SUMS with no key in the installer'
          Refused 'install-signer.ps1' 'signed' "isn't validly signed" 'an installer without the required Authenticode signer'

          '--- a signed release installs and starts'
          $env:IDLE_FIGHTERZ_RELEASE = "$url/signed.json"
          $r = Run-Install "irm $url/install-test.ps1 | iex"
          if ($r.code -ne 0) { throw "install.ps1 failed (exit $($r.code))" }
          if ($r.out -notmatch 'SHA256SUMS signature ok') { throw 'the signature was not checked' }
          if (-not (Test-Path "$dir\idle-fighterz.exe")) { throw "no idle-fighterz.exe in $dir" }
          if (-not (Registered)) { throw 'not in Apps' }
          Start-Sleep 15
          $first = @(Get-Process idle-fighterz -ErrorAction SilentlyContinue)
          if ($first.Count -ne 1) { throw "expected one idle-fighterz running, found $($first.Count)" }

          '--- it installs again over the running app'
          $r = Run-Install "irm $url/install-test.ps1 | iex"
          if ($r.code -ne 0) { throw "reinstalling failed (exit $($r.code))" }
          if ($r.out -notmatch 'SHA256SUMS signature ok') { throw 'the signature was not checked' }
          Start-Sleep 15
          $now = @(Get-Process idle-fighterz -ErrorAction SilentlyContinue)
          if ($now.Count -ne 1 -or $now[0].Id -eq $first[0].Id) { throw "expected a new idle-fighterz running, found $($now.Id -join ', ') (was $($first[0].Id))" }

          '--- uninstall'
          Uninstall
          Stop-Process $server.Id

          '--- the latest release, if it has signed Windows assets'
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if (($latest.assets.name -like '*_x64-setup.exe') -and ($latest.assets.name -contains 'SHA256SUMS') -and ($latest.assets.name -contains 'SHA256SUMS.minisig')) {
            Remove-Item Env:IDLE_FIGHTERZ_RELEASE
            $env:IDLE_FIGHTERZ_REPO = $env:GITHUB_REPOSITORY
            $r = Run-Install 'Get-Content -Raw packaging\install.ps1 | iex'
            if ($r.code -ne 0) { throw "install.ps1 failed on $($latest.tag_name) (exit $($r.code))" }
            if (-not (Test-Path "$dir\idle-fighterz.exe")) { throw "no idle-fighterz.exe in $dir" }
            Uninstall
          } else {
            "::notice::skipped the latest release: $($latest.tag_name) has no Windows installer, SHA256SUMS and SHA256SUMS.minisig (this run's installer was tested above)"
          }
          exit 0 # a PowerShell step ends with $LASTEXITCODE, which an expected install.ps1 failure may have left at 1

  # install.sh is served as https://highskore.com/install.sh; packaging/install.sh is a copy. scripts/test-install-sh.sh
  # checks its signature verifiers with a throwaway minisign key, then installs this build from a stand-in release:
  # unsigned, signed, signed then changed, signed with another key or with none in the installer
  install-sh:
    needs: [build, package-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: macos, package: '*_universal.zip', minisign: macos.zip }
          - { os: ubuntu-22.04, platform: linux, package: '*_amd64.AppImage', minisign: linux.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: idle-fighterz-${{ matrix.platform }}
          path: release

      - name: the copy matches highskore.com
        run: |
          curl -fsSL https://highskore.com/install.sh | cmp - packaging/install.sh && exit 0
          case "$GITHUB_REF" in
            refs/tags/desktop-v*) echo "::error::packaging/install.sh differs from https://highskore.com/install.sh"; exit 1 ;;
            *) echo "::warning::packaging/install.sh differs from https://highskore.com/install.sh" ;;
          esac

      - name: install.sh
        run: |
          F=minisign-$MINISIGN_VERSION-${{ matrix.minisign }}
          curl -fsSL "https://github.com/jedisct1/minisign/releases/download/$MINISIGN_VERSION/$F" -o "$RUNNER_TEMP/$F"
          case "${{ matrix.platform }}" in
            macos) SHA=$MINISIGN_MACOS_SHA256; (cd "$RUNNER_TEMP" && unzip -q "$F" minisign) ; MS=$RUNNER_TEMP/minisign ;;
            linux) SHA=$MINISIGN_LINUX_SHA256; tar -xzf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"; MS=$RUNNER_TEMP/minisign-linux/x86_64/minisign ;;
          esac
          echo "$SHA  $RUNNER_TEMP/$F" | shasum -a 256 -c -
          chmod +x "$MS"
          chmod +x release/${{ matrix.package }}
          sh scripts/test-install-sh.sh "$MS" release/${{ matrix.package }}

  release:
    needs: [build, package-macos, package-windows, install-ps1, install-sh]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # the packages, outside the checkout: the Linux ones come straight from the build job
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/release
          pattern: idle-fighterz-*
          merge-multiple: true

      - name: SHA256SUMS
        run: |
          cd "$RUNNER_TEMP/release"
          # plain files named as the build names them, nothing else
          shopt -s dotglob
          for f in *; do
            [ -f "$f" ] && [ ! -L "$f" ] && [[ "$f" =~ ^IdleFighterZ_[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected file in the packages: $f"; exit 1; }
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # every checker of SHA256SUMS.minisig embeds the same key: install.sh's, which the signature is checked against below
      - name: one minisign key
        run: |
          SH=$(sed -n "s/^MINISIGN_PUBKEY='\(.*\)'$/\1/p" packaging/install.sh)
          PS=$(sed -n "s/^ *\$MinisignPublicKey = '\(.*\)'$/\1/p" packaging/install.ps1)
          RS=$(sed -n 's/^const MINISIGN_PUBKEY: &str = "\(.*\)";$/\1/p' src-tauri/src/update.rs)
          echo "install.sh: $SH"; echo "install.ps1: $PS"; echo "update.rs: $RS"
          [ -n "$SH" ] && [ "$PS" = "$SH" ] && [ "$RS" = "$SH" ] || { echo "::error::install.ps1's or update.rs's minisign key isn't install.sh's"; exit 1; }

      # SHA256SUMS.minisig: the installers check it with the public key they embed. The secret key is only in this
      # step, and on disk only while it runs; the signature is checked against packaging/install.sh's key before it
      # goes out
      - name: sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          # the installers refuse a release without SHA256SUMS.minisig, so there's no releasing without the key
          if [ -z "$MINISIGN_SECRET_KEY" ]; then echo "::error::no MINISIGN_SECRET_KEY in the release environment: the installers would refuse this release"; exit 1; fi
          F=minisign-$MINISIGN_VERSION-linux.tar.gz
          curl -fsSL "https://github.com/jedisct1/minisign/releases/download/$MINISIGN_VERSION/$F" -o "$RUNNER_TEMP/$F"
          echo "$MINISIGN_LINUX_SHA256  $RUNNER_TEMP/$F" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"
          MS=$RUNNER_TEMP/minisign-linux/x86_64/minisign
          KEY=$RUNNER_TEMP/minisign.key
          trap 'rm -f "$KEY"' EXIT
          # the key file as minisign -G wrote it; a secret holding only its second line works too
          (umask 077; case "$MINISIGN_SECRET_KEY" in
            'untrusted comment:'*) printf '%s\n' "$MINISIGN_SECRET_KEY" ;;
            *) printf 'untrusted comment: minisign secret key\n%s\n' "$MINISIGN_SECRET_KEY" ;;
          esac > "$KEY")
          unset MINISIGN_SECRET_KEY
          # -l: the legacy format, Ed25519 over the file itself, which the installers verify without minisign
          printf '%s\n' "$MINISIGN_PASSWORD" | "$MS" -S -l -s "$KEY" -m "$RUNNER_TEMP/release/SHA256SUMS" -t "idle-fighterz $GITHUB_REF_NAME"
          PUB=$(sed -n "s/^MINISIGN_PUBKEY='\(.*\)'$/\1/p" packaging/install.sh)
          "$MS" -V -P "$PUB" -m "$RUNNER_TEMP/release/SHA256SUMS"
          cat "$RUNNER_TEMP/release/SHA256SUMS.minisig"

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          WIN_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: |
          NAME=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          cd "$RUNNER_TEMP/release"
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          NOTE="$NAME $VERSION for macOS 11+ (Apple silicon and Intel), Windows 10+ (x64) and Linux (x86_64 AppImage and .deb)."
          [ "$MAC_SIGNED" = true ] || NOTE="$NOTE The macOS build is not notarized: right-click the app → Open the first time."
          [ "$WIN_SIGNED" = true ] || NOTE="$NOTE The Windows build is not signed: SmartScreen may say \"Windows protected your PC\"; click More info → Run anyway."
          gh release create "$GITHUB_REF_NAME" --title "$NAME $VERSION" --notes "$NOTE" -- *
