[package]
name = "idle-fighterz"
version = "0.1.1"
description = "idle-fighterz: the Idle FighterZ game as a desktop widget"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png", "macos-private-api"] }
serde_json = "=1.0.154"
tauri-plugin-autostart = "=2.6.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-window-state = "=2.5.0"
# the game on the Rust core (feature rust-core), from the game submodule
planet-core = { path = "../game/rust/planet-core", optional = true }
# and planet-render draws it (feature rust-core)
planet-render = { path = "../game/rust/planet-render", optional = true }
# the hidden game's quiet hours, in local time (feature rust-core)
chrono = { version = "=0.4.45", optional = true, default-features = false, features = ["clock"] }

# macOS notifications go through UNUserNotificationCenter directly: it asks for permission and reports it
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-user-notifications = "=0.3.2"
# the native renderer (feature native-renderer): a CALayer showing a framebuffer, and the stand-in PNG frames
objc2-core-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "objc2", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-quartz-core = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CATransaction"] }
png = { version = "=0.18.1", optional = true }

[features]
# off by default: the web view stays the renderer. On, a hidden setting picks the native one (see NATIVE.md); macOS only
native-renderer = ["dep:objc2-core-foundation", "dep:objc2-core-graphics", "dep:objc2-quartz-core", "dep:png"]
# off by default: game.js runs the game in the web view. On, planet-core runs it natively and planet-render draws it,
# behind a HUD-only page (see NATIVE.md)
rust-core = ["dep:planet-core", "dep:planet-render", "dep:chrono"]

[dev-dependencies]
tauri = { version = "=2.12.1", features = ["test"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification = "=2.5.1"
tauri-plugin-single-instance = "=2.5.3"

# the same gtk as tauri's, to ask the screen whether a compositor will draw the transparent window
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
# the freedesktop settings portal's color scheme, for a tray icon that shows on the panel
zbus = "=5.19.0"

# the taskbar's light or dark theme, for the same
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "=0.56.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# the game's per-pixel loops run for every frame drawn (feature rust-core): built for speed rather than size
[profile.release.package.planet-render]
opt-level = 3
[profile.release.package.planet-core]
opt-level = 3
