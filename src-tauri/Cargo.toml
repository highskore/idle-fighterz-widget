[package]
name = "idle-fighterz"
version = "0.5.0"
description = "idle-fighterz: the Idle FighterZ game as a desktop widget"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png", "macos-private-api"] }
serde_json = "=1.0.154"
tauri-plugin-autostart = "=2.6.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-window-state = "=2.5.0"
# the game on the Rust core (feature rust-core), from the game submodule
planet-core = { path = "../game/rust/planet-core", optional = true }
# and planet-render draws it (feature rust-core)
planet-render = { path = "../game/rust/planet-render", optional = true }
# local time: the hidden game's quiet hours, snoozes until tomorrow, photo names
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
# photo mode's PNG
png = "=0.18.1"
# updates: the release over https (rustls with ring, verified by the platform: no OpenSSL to link on Linux), its
# minisign signature, sha256s and versions
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
minisign-verify = "=0.3.0"
sha2 = "=0.10.9"
semver = "=1.0.28"
# the screensaver mirrors the run over it (feature rust-core): saver/link, a local socket or pipe, nothing on disk
saver-link = { path = "../saver/link", optional = true }

# macOS notifications go through UNUserNotificationCenter directly: it asks for permission and reports it
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-user-notifications = "=0.3.2"
# the native renderer (feature native-renderer): the layer under the HUD page; and the
# spectacles' overlay layers (with rust-core), rendered offscreen in their tests
objc2-core-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "objc2", "CGColorSpace", "CGDataProvider", "CGImage", "CGContext", "CGBitmapContext"] }
objc2-quartz-core = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CATransaction"] }
# the layer under the HUD page (features rust-core and native-renderer): frames written into IOSurfaces, and the tick on
# the efficiency cores with a timer that keeps it on time there
objc2-io-surface = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2-core-foundation"] }
libc = { version = "=0.2.191", optional = true }

[features]
# what ships, on every platform (native-renderer compiles to nothing outside macOS). --no-default-features builds
# 0.1's web-view game
default = ["rust-core", "native-renderer"]
# macOS only: with rust-core, the frames in a layer under the HUD page; and the spectacles' layers
native-renderer = ["dep:objc2-core-foundation", "dep:objc2-core-graphics", "dep:objc2-quartz-core", "dep:objc2-io-surface", "dep:libc"]
# planet-core runs the game natively and planet-render draws it, behind a HUD-only page (see NATIVE.md); without it,
# game.js runs the game in the web view
rust-core = ["dep:planet-core", "dep:planet-render", "dep:saver-link"]

[dev-dependencies]
tauri = { version = "=2.12.1", features = ["test"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification = "=2.5.1"
tauri-plugin-single-instance = "=2.5.3"

# the same gtk as tauri's, to ask the screen whether a compositor will draw the transparent window
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
# the freedesktop settings portal's color scheme, for a tray icon that shows on the panel
zbus = "=5.19.0"
# X11: whether Alt is held (ghost mode) and whether the active window is fullscreen (auto-hide); loaded at run time
x11-dl = "=2.21.0"

# the taskbar's light or dark theme, for the same
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "=0.56.0"
# the screensaver install (its 8.3 path, and telling Windows screensavers are on), and whether updates run elevated
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# the game's per-pixel loops run for every frame drawn (feature rust-core): built for speed rather than size
[profile.release.package.planet-render]
opt-level = 3
[profile.release.package.planet-core]
opt-level = 3
