[package]
name = "powerrr"
version = "0.1.0"
description = "powerrr: the highskore planet game as a desktop widget"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png", "macos-private-api"] }
serde_json = "=1.0.154"
tauri-plugin-autostart = "=2.6.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-window-state = "=2.5.0"

# macOS notifications go through UNUserNotificationCenter directly: it asks for permission and reports it
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-user-notifications = "=0.3.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification = "=2.5.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
